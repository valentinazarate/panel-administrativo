<div class="flex flex-col gap-6 lg:flex-row">
  <!-- Filtros -->
  <aside class="lg:w-64 flex flex-col gap-4 bg-white p-4 rounded-lg shadow-sm h-fit">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Buscar</label>
      <input pInputText [(ngModel)]="busqueda" placeholder="Nombre del producto" class="w-full" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Categoría</label>
      <p-select [options]="categorias()" [(ngModel)]="categoriaSeleccionada" placeholder="Todas" [showClear]="true" class="w-full" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Marca</label>
      <p-select [options]="marcas()" [(ngModel)]="marcaSeleccionada" placeholder="Todas" [showClear]="true" class="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium">Precio máximo: {{ precioMax() | currency:'ARS' }}</label>
      <p-slider [(ngModel)]="precioMax" [min]="0" [max]="10000" [step]="100" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">Ordenar por precio</label>
      <div class="flex gap-2">
        <p-button label="Menor a mayor" size="small" [outlined]="orden() !== 'asc'" (onClick)="orden.set('asc')" />
        <p-button label="Mayor a menor" size="small" [outlined]="orden() !== 'desc'" (onClick)="orden.set('desc')" />
      </div>
    </div>

    <p-button label="Limpiar filtros" severity="secondary" [text]="true" (onClick)="limpiarFiltros()" />
  </aside>

  <!-- Grilla de productos -->
  <div class="flex-1">
    <h2 class="text-xl font-semibold mb-4">Catálogo</h2>

    @if (productosFiltrados().length === 0) {
      <p class="text-gray-500">No se encontraron productos con esos filtros.</p>
    }

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      @for (producto of productosFiltrados(); track producto.id) {
       <a [routerLink]="['/producto', producto.id]" class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow border border-crema-oscuro">
  <div class="aspect-square w-full overflow-hidden bg-crema">
    <img [src]="'/productos/' + producto.slug + '.jpg'" [alt]="producto.nombre" class="w-..." >
  </div>
  <div class="p-3 flex flex-col gap-2">
    <span class="text-xs text-gray-500">{{ producto.marca.nombre }}</span>
    <span class="font-medium text-verde-oscuro">{{ producto.nombre }}</span>
    <span class="font-semibold text-verde">{{ +producto.precio_venta| currency:'ARS' }}</span>
    <p-button label="Agregar" icon="pi pi-shopping-cart" size="small" (onClick)="agregarAlCarrito(producto, $event)" />
  </div>
</a>
      }
    </div>
  </div>
</div>
