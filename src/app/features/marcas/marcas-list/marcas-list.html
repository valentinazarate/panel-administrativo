<div class="flex items-center justify-between mb-4">
  <h2 class="text-xl font-semibold">Marcas</h2>
  <p-button label="Nueva marca" icon="pi pi-plus" (onClick)="abrirNueva()" />
</div>

<p-table [value]="marcas()" [tableStyle]="{ 'min-width': '40rem' }">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th style="width: 8rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-marca>
    <tr>
      <td>{{ marca.nombre }}</td>
      <td>{{ marca.descripcion }}</td>
      <td>
        <div class="flex gap-2">
          <p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="abrirEditar(marca)" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="eliminar(marca)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-marca-form
  [visible]="dialogVisible()"
  [marca]="marcaSeleccionada()"
  (visibleChange)="dialogVisible.set($event)"
  (guardar)="guardar($event)"
/>
