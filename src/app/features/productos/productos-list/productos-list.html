<div class="flex items-center justify-between mb-4">
  <h2 class="text-xl font-semibold">Productos</h2>
  <p-button label="Nuevo producto" icon="pi pi-plus" (onClick)="abrirNuevo()" />
</div>

<p-table [value]="productos()" [tableStyle]="{ 'min-width': '40rem' }">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Precio</th>
      <th>Stock</th>
      <th style="width: 8rem">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-producto>
    <tr>
      <td>{{ producto.nombre }}</td>
      <td>{{ producto.precio | currency:'ARS' }}</td>
      <td>{{ producto.stock }}</td>
      <td>
        <div class="flex gap-2">
          <p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="abrirEditar(producto)" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="eliminar(producto)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

<app-producto-form
  [visible]="dialogVisible()"
  [producto]="productoSeleccionado()"
  (visibleChange)="dialogVisible.set($event)"
  (guardar)="guardar($event)"
/>
